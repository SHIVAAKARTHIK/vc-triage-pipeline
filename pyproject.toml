[project]
name = "triage"
version = "0.1.0"
description = "AI-augmented deal triage pipeline: source, analyse and memo seed-stage startups."
readme = "README.md"
authors = [
    { name = "karth", email = "karthikshiva.manju65@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.122.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "typer>=0.27.1",
]

[project.scripts]
triage = "triage.cli:app"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m \"not live\""
markers = [
    # Tests that hit the network or a real LLM. Excluded from the default run:
    #   uv run pytest -m live
    "live: requires network access or an ANTHROPIC_API_KEY",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer's `= typer.Option(...)` / `typer.Argument(...)` default-arg idiom is by
# design, not the flake8-bugbear B008 footgun (a mutable default built once at
# import time and reused) it's meant to catch.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
